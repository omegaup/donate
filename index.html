<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8ff">
  <meta name="description" content="Elige cómo donar a omegaUp: Stripe, PayPal, Benevity o transferencia bancaria.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Donar a omegaUp">
  <meta property="og:description" content="Elige tu método de donación preferido.">
  <meta property="og:url" content="https://donate.omegaup.org/">
  <meta property="og:image" content="https://donate.omegaup.org/assets/logo-square.svg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Donar a omegaUp">
  <meta name="twitter:description" content="Elige tu método de donación preferido.">
  <meta name="twitter:image" content="https://donate.omegaup.org/assets/logo-square.svg">
  <title>Donar a omegaUp</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-square.svg">
  <link rel="stylesheet" href="styles.css">
  <script defer src="links.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <main class="page">
    <div class="brand">
      <div class="logo-wrap">
        <img src="assets/logo.svg" alt="omegaUp" class="logo" width="204" height="204">
      </div>
      <h1>Donaciones</h1>
      <p>Elige tu forma de apoyar</p>
    </div>
    <nav class="links" aria-label="Opciones para donar">
      <a class="link" data-method="stripe" hidden>
        <span class="button-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/></svg></span>
        <span class="button-copy"><strong>Tarjeta de crédito o débito</strong><small>Stripe</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" data-method="paypal" hidden>
        <span class="button-icon paypal" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M8 3h7c4 0 5 3 4 6-.7 3.2-3.1 4.8-6.5 4.8h-3L8 21H4.5L8 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 8h4c3 0 4.3 1.7 3.6 4.3-.7 2.5-2.2 3.7-5.6 3.7h-2.5" stroke="currentColor" stroke-width="1.5"/></svg></span>
        <span class="button-copy"><strong>Donar con PayPal</strong><small>PayPal</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" data-method="benevity" hidden>
        <span class="button-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M20 8c0 5-8 11-8 11S4 13 4 8a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 11.5h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
        <span class="button-copy"><strong>Donar con tu empresa</strong><small>Benevity · Matching</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" data-method="bank" hidden>
        <span class="button-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m3 9 9-5 9 5M4 10h16M6 10v8m4-8v8m4-8v8m4-8v8M3 20h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="button-copy"><strong>Transferencia bancaria</strong><small>Depósito directo</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <p class="availability" id="availability" hidden>Próximamente estarán disponibles los enlaces de donación.</p>
    <footer>donate.omegaup.org</footer>
  </main>
</body>
</html>
